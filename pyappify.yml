name: "ok-script-app"
uac: true
icon: "icons/icon.png"
profiles:
  - name: "China"
    git_url: "https://github.com/bayue520/ok-game.git"
    admin: true
    main_script: "test_launcher.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    pip_args: "--no-deps"
    use_pythonw: true
    show_add_defender: true

  - name: "Global"
    git_url: "https://github.com/bayue520/ok-game.git"
    main_script: "test_launcher.py"
    requirements: "requirements.txt"

  - name: "Web"
    main_script: "web_main.py"
    requires_python: "3.12"
    requirements: "requirements-web.txt"
    pip_args: "--no-deps"
    use_pythonw: true
